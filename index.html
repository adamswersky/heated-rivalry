<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heated Rivalry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            color: #fff;
            background: #0a0a0f;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 2rem;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(220,38,38,0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 20%, rgba(37,99,235,0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(220,38,38,0.05) 0%, transparent 60%),
                #0a0a0f;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem;
            letter-spacing: 0.08em;
            line-height: 1;
            margin-bottom: 0.5rem;
            position: relative;
        }
        .logo .heated {
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo .rivalry {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        /* Characters */
        .characters {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3.5rem;
            position: relative;
        }
        .character {
            text-align: center;
            position: relative;
        }
        .character img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            background: #1a1a2e;
        }
        .character:nth-child(1) img:hover,
        .character:nth-child(3) img:hover {
            border-color: rgba(239,68,68,0.6);
            box-shadow: 0 0 30px rgba(239,68,68,0.3);
            transform: scale(1.05);
        }
        .character:nth-child(2) img:hover,
        .character:nth-child(4) img:hover {
            border-color: rgba(59,130,246,0.6);
            box-shadow: 0 0 30px rgba(59,130,246,0.3);
            transform: scale(1.05);
        }
        .character .name {
            margin-top: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.01em;
        }
        .character .role {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.4);
            font-weight: 500;
        }
        .character:nth-child(1) .name { color: #f87171; }
        .character:nth-child(2) .name { color: #60a5fa; }
        .character:nth-child(3) .name { color: #f87171; }
        .character:nth-child(4) .name { color: #60a5fa; }

        .vs-badge {
            display: none;
        }

        /* Quote machine */
        .quote-section {
            width: 100%;
            max-width: 700px;
            position: relative;
        }
        .quote-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
            transition: border-color 0.4s;
        }
        .quote-card.red-glow {
            border-color: rgba(239,68,68,0.3);
            box-shadow: 0 0 40px rgba(239,68,68,0.06);
        }
        .quote-card.blue-glow {
            border-color: rgba(59,130,246,0.3);
            box-shadow: 0 0 40px rgba(59,130,246,0.06);
        }
        .quote-mark {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            line-height: 1;
            color: rgba(255,255,255,0.08);
            position: absolute;
            top: 0.5rem;
            left: 1.5rem;
        }
        .quote-text {
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.7;
            color: rgba(255,255,255,0.9);
            margin-bottom: 1.2rem;
            font-style: italic;
            max-width: 550px;
        }
        .quote-text.entrance {
            animation: fadeSlideIn 0.4s ease-out;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .quote-speaker {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .quote-speaker.red { color: #f87171; }
        .quote-speaker.blue { color: #60a5fa; }
        .quote-speaker.neutral { color: rgba(255,255,255,0.5); }
        .quote-ep {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.25);
            margin-top: 0.3rem;
        }

        .generate-btn {
            margin-top: 1.5rem;
            padding: 0.85rem 2.5rem;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #ef4444, #7c3aed, #3b82f6);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(239,68,68,0.3), 0 8px 30px rgba(59,130,246,0.2);
        }
        .generate-btn:active {
            transform: scale(0.98);
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem 2rem;
            color: rgba(255,255,255,0.2);
            font-size: 0.8rem;
        }
        footer a {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
        }
        footer a:hover { color: rgba(255,255,255,0.5); }

        /* Responsive */
        @media (max-width: 700px) {
            .logo { font-size: 3.2rem; }
            .characters { gap: 1.2rem; }
            .character img { width: 110px; height: 110px; }
            .quote-text { font-size: 1.05rem; }
            .quote-card { padding: 2rem 1.5rem; }
        }
        @media (max-width: 400px) {
            .character img { width: 80px; height: 80px; }
            .character .name { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="logo">
            <span class="heated">Heated</span> <span class="rivalry">Rivalry</span>
        </div>
        <div class="tagline">Two rivals. One secret. Everything to lose.</div>

        <div class="characters">
            <div class="character">
                <img src="shane.jpg" alt="Shane Hollander">
                <div class="name">Shane Hollander</div>
                <div class="role">Hudson Williams</div>
            </div>
            <div class="character">
                <img src="ilya.jpg" alt="Ilya Rozanov">
                <div class="name">Ilya Rozanov</div>
                <div class="role">Connor Storrie</div>
            </div>
            <div class="character">
                <img src="scott.jpg" alt="Scott Hunter">
                <div class="name">Scott Hunter</div>
                <div class="role">Fran&ccedil;ois Arnaud</div>
            </div>
            <div class="character">
                <img src="elena.jpg" alt="Elena Rygg">
                <div class="name">Elena Rygg</div>
                <div class="role">Nadine Bhabha</div>
            </div>
        </div>

        <div class="quote-section">
            <div class="quote-card" id="quoteCard">
                <div class="quote-mark">&ldquo;</div>
                <div class="quote-text" id="quoteText">Hit the button to drop a random quote...</div>
                <div class="quote-speaker neutral" id="quoteSpeaker"></div>
                <div class="quote-ep" id="quoteEp"></div>
            </div>
            <div style="text-align:center">
                <button class="generate-btn" id="generateBtn">Drop the Puck</button>
            </div>
        </div>
    </section>

    <footer>
        A fan site for <a href="https://www.imdb.com/title/tt35495073/">Heated Rivalry</a> on Crave.
        Based on the novel by Rachel Reid.
    </footer>

    <script>
        const quotes = [
            { text: "Never in life have I blushed. Russians do not do this.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "You will not be so nice when we beat you.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "What the fuck do you want, Rozanov? You haven't answered a text from me in, like, 6 months. You won't even acknowledge I exist unless there's a fucking camera pointed at us.", speaker: "Shane Hollander", team: "red", ep: "Season 1" },
            { text: "The family I craved, the family that I needed, that I still need today\u2026 hockey gave it to me.", speaker: "Scott Hunter", team: "red", ep: "Season 1" },
            { text: "Nobody wants to be kept a secret.", speaker: "Elena Rygg", team: "blue", ep: "Season 1" },
            { text: "How does it feel to be perfect? Fucking perfect. Thanks for asking. In fucking French.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "It's true, I've been with many women, but I have only been in love with one person.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "It's not just being gay. It's you. It's this. Being gay is one thing, but fucking your arch-rival is another thing.", speaker: "Shane Hollander", team: "red", ep: "Season 1" },
            { text: "No, no. I never said 40 goals. It's a lie. I said 50.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "Dreaming of what? Bronze medal?", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "I want you more than I've wanted anything in a long time.", speaker: "Scott Hunter", team: "red", ep: "Season 1" },
            { text: "This is such a bad idea.", speaker: "Shane Hollander", team: "red", ep: "Season 1" },
            { text: "She's great, but we're just not compatible, I guess.", speaker: "Shane Hollander", team: "red", ep: "Season 1" },
            { text: "Well, I think you can tell your parents you're gay without giving them a list of all the guys you're sleeping with.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "I'm on the cover of the video game.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "And your dad is, what, boring? Is that where you get your boring?", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "Hey, hey, hey, hey. We're good here. Your family is here. Your boyfriend is here. You're good here, OK?", speaker: "Ilya Rozanov", team: "blue", ep: "1x06" },
            { text: "See you in the final.", speaker: "Ilya Rozanov", team: "blue", ep: "Season 1" },
            { text: "My boyfriend?", speaker: "Shane Hollander", team: "red", ep: "1x06" },
        ];

        let lastIndex = -1;
        const btn = document.getElementById('generateBtn');
        const textEl = document.getElementById('quoteText');
        const speakerEl = document.getElementById('quoteSpeaker');
        const epEl = document.getElementById('quoteEp');
        const card = document.getElementById('quoteCard');

        btn.addEventListener('click', () => {
            let idx;
            do {
                idx = Math.floor(Math.random() * quotes.length);
            } while (idx === lastIndex && quotes.length > 1);
            lastIndex = idx;

            const q = quotes[idx];

            // Animate
            textEl.classList.remove('entrance');
            void textEl.offsetWidth; // reflow
            textEl.classList.add('entrance');

            textEl.textContent = `\u201C${q.text}\u201D`;
            speakerEl.textContent = `\u2014 ${q.speaker}`;
            speakerEl.className = `quote-speaker ${q.team}`;
            epEl.textContent = q.ep;

            card.classList.remove('red-glow', 'blue-glow');
            card.classList.add(q.team === 'red' ? 'red-glow' : 'blue-glow');
        });
    </script>
</body>
</html>
